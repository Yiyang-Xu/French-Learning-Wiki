name: Deploy Quartz Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout Quartz v4.5.2
        run: git clone --depth 1 --branch v4.5.2 https://github.com/jackyzha0/quartz.git quartz-src

      - name: Overlay wiki content and configuration
        run: |
          rm -rf quartz-src/content
          cp -R content quartz-src/content
          cp quartz.config.ts quartz-src/quartz.config.ts
          cp quartz.layout.ts quartz-src/quartz.layout.ts
          cp custom.scss quartz-src/quartz/styles/custom.scss

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz
        working-directory: quartz-src
        run: npx quartz build

      - name: Verify build output
        run: |
          test -f quartz-src/public/index.html
          test -f quartz-src/public/index.css
          test -f quartz-src/public/A1/index.html
          grep -q "index.css" quartz-src/public/A1/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
